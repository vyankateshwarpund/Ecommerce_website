{% extends 'base.html' %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="container section-padding text-center">
  <div class="py-5">
    <div class="display-1 text-primary fw-bold">404</div>
    <div class="empty-state-icon">
      <i class="fas fa-ghost text-muted"></i>
    </div>
    <h2 class="empty-state-title mt-3">Page Not Found</h2>
    <p class="empty-state-text mx-auto" style="max-width: 500px;">
      Oops! The page you are looking for doesn't exist, was removed, or had its name changed.
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-primary-custom">
      <i class="fas fa-house me-2"></i>Back to Homepage
    </a>
  </div>
</div>
{% endblock %}
