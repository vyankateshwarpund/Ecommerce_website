{% extends 'base.html' %}
{% load static %}

{% block title %}500 — Internal Server Error | SPCart{% endblock %}

{% block content %}
<section class="section-padding bg-light d-flex align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="container text-center" style="max-width: 600px;">
    <div class="bg-white rounded-5 p-5 border shadow-lg">
      <div class="display-1 fw-extrabold text-warning mb-3">500</div>
      <div class="mb-4">
        <i class="fas fa-triangle-exclamation display-3 text-warning opacity-75"></i>
      </div>
      <h2 class="fw-bold text-dark mb-2">Server Error</h2>
      <p class="text-secondary leading-relaxed mb-4 fs-6">
        Something went wrong on our server. Our engineering team has been notified and is working to resolve it!
      </p>
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <a href="{% url 'core:home' %}" class="btn btn-primary-custom btn-lg px-4 rounded-pill shadow-sm">
          <i class="fas fa-house me-2"></i>Back to Homepage
        </a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
