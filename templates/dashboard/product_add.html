{% extends 'dashboard/base_admin.html' %}

{% block title %}＋ Quick Add Product | SPCart Admin{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h3 class="fw-bold text-dark mb-1"><i class="fas fa-plus-circle text-primary me-2"></i>Quick Add New Product</h3>
    <p class="text-muted small mb-0">Fill in the product details to add it directly into your live database catalog.</p>
  </div>
  <a href="{% url 'dashboard:products' %}" class="btn btn-outline-secondary rounded-pill px-4">
    ← Back to Products
  </a>
</div>

<div class="bg-white rounded-5 border p-5 shadow-sm" style="max-width: 850px;">
  <form method="POST" enctype="multipart/form-data" action="{% url 'dashboard:product_add' %}">
    {% csrf_token %}

    <div class="row g-3">
      
      <!-- Product Name -->
      <div class="col-12">
        <label class="form-label fw-semibold text-dark">Product Name *</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Ultra Wireless Noise Canceling Headphones" required>
      </div>

      <!-- Category & Brand -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-dark">Category *</label>
        <select name="category_id" class="form-select" required>
          <option value="">Select Category...</option>
          {% for c in categories %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold text-dark">Brand</label>
        <select name="brand_id" class="form-select">
          <option value="">Select Brand...</option>
          {% for b in brands %}
            <option value="{{ b.id }}">{{ b.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Pricing -->
      <div class="col-md-4">
        <label class="form-label fw-semibold text-dark">MRP Price (₹) *</label>
        <input type="number" step="0.01" name="price" class="form-control" placeholder="e.g. 19999" required>
      </div>

      <div class="col-md-4">
        <label class="form-label fw-semibold text-dark">Discount Price (₹)</label>
        <input type="number" step="0.01" name="discount_price" class="form-control" placeholder="e.g. 14999 (Optional)">
      </div>

      <div class="col-md-4">
        <label class="form-label fw-semibold text-dark">Inventory Stock *</label>
        <input type="number" name="stock" class="form-control" value="15" required>
      </div>

      <!-- Badge Selection -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-dark">Product Badge Tag</label>
        <select name="badge" class="form-select">
          <option value="">None</option>
          <option value="bestseller">Best Seller</option>
          <option value="new">New Arrival</option>
          <option value="trending">Trending</option>
          <option value="limited">Limited Stock</option>
        </select>
      </div>

      <!-- Main Image Upload -->
      <div class="col-md-6">
        <label class="form-label fw-semibold text-dark">Product Main Image</label>
        <input type="file" name="main_image" class="form-control" accept="image/*">
      </div>

      <!-- Description -->
      <div class="col-12">
        <label class="form-label fw-semibold text-dark">Product Description *</label>
        <textarea name="description" class="form-control" rows="4" placeholder="Enter key features, specifications, and warranty details..." required></textarea>
      </div>

      <!-- Submit CTA -->
      <div class="col-12 pt-3">
        <button type="submit" class="btn btn-primary-custom btn-lg px-5 shadow-sm rounded-4">
          <i class="fas fa-save me-2"></i> Save Product to Store
        </button>
      </div>

    </div>
  </form>
</div>
{% endblock %}
