{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login — ShopSphere{% endblock %}

{% block content %}
<div class="container section-padding">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-shopsphere p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="fas fa-right-to-bracket text-primary display-4 mb-2"></i>
          <h2 class="fw-bold">Welcome Back</h2>
          <p class="text-muted">Sign in to your ShopSphere account</p>
        </div>

        <form method="POST">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary-custom w-100 btn-lg mt-3">Sign In</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-bold">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
