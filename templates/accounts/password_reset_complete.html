{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | SPCart{% endblock %}

{% block content %}
<section class="section-padding bg-light">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="bg-white rounded-5 p-4 p-md-5 border shadow-sm text-center">
          
          <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:72px; height:72px;">
            <i class="fas fa-circle-check fs-2"></i>
          </div>
          
          <h2 class="fw-bold text-dark mb-2">Password Reset Successful!</h2>
          <p class="text-muted mb-4">Your password has been changed successfully. You may now log in with your new password.</p>
          
          <a href="{% url 'accounts:login' %}" class="btn btn-primary-custom w-100 btn-lg shadow-sm rounded-4">
            <i class="fas fa-right-to-bracket me-2"></i>Log In Now
          </a>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
