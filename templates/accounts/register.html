{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Account — ShopSphere{% endblock %}

{% block content %}
<div class="container section-padding">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card-shopsphere p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="fas fa-user-plus text-primary display-4 mb-2"></i>
          <h2 class="fw-bold">Create Account</h2>
          <p class="text-muted">Join ShopSphere for a seamless shopping experience</p>
        </div>

        <form method="POST">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary-custom w-100 btn-lg mt-3">Register Now</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="text-muted mb-0">Already registered? <a href="{% url 'accounts:login' %}" class="fw-bold">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
