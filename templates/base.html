{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}SPCart — Your premium online shopping destination{% endblock %}" />
  <title>{% block title %}SPCart{% endblock %} | SPCart</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <!-- SPCart Global CSS -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet" />

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- NAVBAR -->
  {% include 'includes/navbar.html' %}

  <!-- DJANGO MESSAGES -->
  {% include 'includes/messages.html' %}

  <!-- MAIN CONTENT -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  {% include 'includes/footer.html' %}

  <!-- Back to Top Button -->
  <button id="back-to-top"
    style="display:none; position:fixed; bottom:28px; right:28px; z-index:999;
           width:44px; height:44px; border-radius:50%; background:var(--primary);
           color:white; border:none; box-shadow:var(--shadow-md); cursor:pointer;
           align-items:center; justify-content:center; font-size:18px; transition:var(--transition);">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SPCart Main JS -->
  <script src="{% static 'js/main.js' %}"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
