{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="container section-padding">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card-shopsphere p-4 p-md-5">
        <h2 class="section-title text-center">Get in Touch</h2>
        <p class="section-subtitle text-center">Have a question or feedback? Send us a message.</p>
        <div class="section-divider mx-auto"></div>

        <form onsubmit="event.preventDefault(); showToast('Message sent! We will contact you soon.', 'success');">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Your Name</label>
              <input type="text" class="form-control" required placeholder="John Doe">
            </div>
            <div class="col-md-6">
              <label class="form-label">Your Email</label>
              <input type="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="col-12">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" required placeholder="Order inquiry, feedback...">
            </div>
            <div class="col-12">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <div class="col-12 text-center mt-4">
              <button type="submit" class="btn btn-primary-custom btn-lg w-100">Send Message</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
